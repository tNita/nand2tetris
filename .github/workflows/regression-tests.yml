name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests of assembler (project 6)
        run: bash 06_assembler/run_regression_tests.sh

      - name: Run regression test of vm implementation (project 7, 8)
        run: bash 07_08_vm/run_regression_tests.sh

      - name: Run regression tests of compiler (project 10, 11)
        run: bash 10_11_jack_compiler/run_regression_tests.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run regression tests of Java transpiler (project 13)
        run: bash 13_transpiler_to_java/run_regression_tests.sh
